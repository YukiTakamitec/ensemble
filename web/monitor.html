<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ensemble · live monitor</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #131822;
    --panel-2: #1a2030;
    --border: #232b3d;
    --text: #e6e9ef;
    --muted: #8a93a6;
    --codex: #3b82f6;
    --codex-dim: #1e3a5f;
    --claude: #a855f7;
    --claude-dim: #3b2a5c;
    --sys: #5b657a;
    --green: #22c55e;
    --amber: #f59e0b;
    --red: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Meiryo", system-ui, sans-serif;
    font-size: 14px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 18px;
    background: linear-gradient(180deg, #141a26, #0e131c);
    border-bottom: 1px solid var(--border);
  }
  .brand { font-weight: 700; letter-spacing: .5px; font-size: 15px; }
  .brand .dot { color: var(--codex); }
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: var(--panel-2); border: 1px solid var(--border);
  }
  .status-pill .ic { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .status-pill.active .ic { background: var(--green); animation: pulse 1.4s infinite; }
  .status-pill.active { color: var(--green); border-color: #1c3a2a; }
  .status-pill.disbanded { color: var(--muted); }
  @keyframes pulse { 0%,100%{ opacity:1; transform:scale(1);} 50%{ opacity:.35; transform:scale(.7);} }
  .meta { color: var(--muted); font-size: 12px; display: flex; gap: 14px; }
  .meta b { color: var(--text); font-variant-numeric: tabular-nums; }
  .agent-pills { display: flex; gap: 8px; margin-left: auto; align-items: center; }
  .apill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 600;
    border: 1px solid var(--border); background: var(--panel-2);
  }
  .apill .ic { width: 7px; height: 7px; border-radius: 50%; }
  .apill.codex { color: #9cc4ff; border-color: var(--codex-dim); }
  .apill.codex .ic { background: var(--codex); }
  .apill.claude { color: #d6b3ff; border-color: var(--claude-dim); }
  .apill.claude .ic { background: var(--claude); }
  .toggle {
    font-size: 12px; color: var(--muted); cursor: pointer; user-select: none;
    padding: 4px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel-2);
  }
  .toggle:hover { color: var(--text); }
  .toggle.off { opacity: .5; }
  .navlink { text-decoration: none; }

  .task-bar {
    flex: 0 0 auto; padding: 8px 18px; font-size: 12px; color: var(--muted);
    background: var(--panel); border-bottom: 1px solid var(--border);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .task-bar b { color: var(--text); font-weight: 600; }
  .phase-bar {
    flex: 0 0 auto; padding: 7px 18px; font-size: 12.5px; font-weight: 600;
    background: var(--panel-2); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 9px; color: var(--text);
  }
  .phase-bar .ph-ic { color: var(--codex); }

  /* ── Columns ── */
  .stage {
    flex: 1 1 auto; display: grid;
    grid-template-columns: 1fr minmax(140px, 0.5fr) 1fr;
    gap: 1px; background: var(--border); overflow: hidden;
  }
  .col { background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
  .col-head {
    flex: 0 0 auto; padding: 9px 14px; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .col-head .ic { width: 9px; height: 9px; border-radius: 50%; }
  .col.left .col-head { color: #9cc4ff; } .col.left .col-head .ic { background: var(--codex); }
  .col.right .col-head { color: #d6b3ff; } .col.right .col-head .ic { background: var(--claude); }
  .col.sys .col-head { color: var(--muted); justify-content: center; } .col.sys .col-head .ic { background: var(--sys); }
  .col-head .role { font-weight: 500; color: var(--muted); font-size: 11px; }
  .feed { flex: 1 1 auto; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
  .feed::-webkit-scrollbar { width: 8px; } .feed::-webkit-scrollbar-thumb { background: #2a3346; border-radius: 4px; }

  /* ── Message cards ── */
  .msg { border-radius: 10px; padding: 10px 12px; border: 1px solid var(--border); background: var(--panel); animation: rise .25s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .col.left .msg { border-left: 3px solid var(--codex); }
  .col.right .msg { border-left: 3px solid var(--claude); }
  .msg .time { font-size: 10px; color: var(--muted); margin-bottom: 5px; font-variant-numeric: tabular-nums; letter-spacing: .3px; }
  .msg .body { white-space: pre-wrap; word-break: break-word; line-height: 1.55; font-size: 13px; }

  .col.sys .feed { padding: 14px 8px; }
  .sysmsg {
    font-size: 11px; color: var(--muted); text-align: center; line-height: 1.4;
    padding: 7px 9px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--border);
  }
  .sysmsg .time { display: block; font-size: 9px; opacity: .7; margin-top: 3px; }
  .stage.hide-sys { grid-template-columns: 1fr 0 1fr; }
  .stage.hide-sys .col.sys { display: none; }

  .empty { margin: auto; color: var(--muted); text-align: center; font-size: 13px; line-height: 1.8; }
  .empty .spin { font-size: 22px; animation: spin 1.4s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer { flex: 0 0 auto; padding: 6px 18px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--border); background: var(--panel); display: flex; gap: 16px; align-items: center; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .live-dot.on { background: var(--green); animation: pulse 1.4s infinite; }
</style>
</head>
<body>
  <header>
    <span class="brand"><span class="dot">◈</span> ensemble</span>
    <span id="status" class="status-pill"><span class="ic"></span><span class="lbl">接続中…</span></span>
    <span class="meta">
      <span>⏱ <b id="elapsed">–</b></span>
      <span>💬 <b id="count">0</b></span>
    </span>
    <span class="agent-pills" id="pills"></span>
    <a class="toggle navlink" href="/roadmap" target="_blank" rel="noopener">🗺 ロードマップ</a>
    <span class="toggle" id="sysToggle">sys表示</span>
  </header>
  <div class="task-bar" id="task">タスク待機中…</div>
  <div class="phase-bar" id="phase"><span class="ph-ic">◷</span><span id="phaseTxt">接続中…</span></div>
  <div class="stage" id="stage">
    <div class="col left">
      <div class="col-head"><span class="ic"></span><span id="leftName">agent-1</span><span class="role" id="leftRole"></span></div>
      <div class="feed" id="leftFeed"></div>
    </div>
    <div class="col sys">
      <div class="col-head"><span class="ic"></span>system</div>
      <div class="feed" id="sysFeed"></div>
    </div>
    <div class="col right">
      <div class="col-head"><span class="ic"></span><span id="rightName">agent-2</span><span class="role" id="rightRole"></span></div>
      <div class="feed" id="rightFeed"></div>
    </div>
  </div>
  <footer>
    <span class="live-dot" id="liveDot"></span>
    <span id="liveTxt">polling…</span>
    <span style="margin-left:auto" id="teamId"></span>
  </footer>

<script>
const API = location.origin;
const qs = new URLSearchParams(location.search);
let team = null;            // selected team object
let lastTs = null;          // newest message timestamp seen
const seen = new Set();     // message ids
let firstTs = null;
let leftAgent = null, rightAgent = null;
let realCount = 0;
let msgCount = 0;
let showSys = true;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const hhmmss = ts => { const d = new Date(ts); const p = n => String(n).padStart(2,'0'); return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; };

function fmtElapsed(ms) {
  if (ms < 0) ms = 0;
  const s = Math.floor(ms/1000), m = Math.floor(s/60);
  return `${m}:${String(s%60).padStart(2,'0')}`;
}

async function jget(path) {
  const r = await fetch(API + path, { cache: 'no-store' });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

function classifyAgents(t) {
  const real = (t.agents || []).filter(a => a.program !== 'ensemble');
  realCount = real.length;
  leftAgent = real[0] || { name: 'agent-1', role: '', program: '' };
  rightAgent = real[1] || { name: 'agent-2', role: '', program: '' };
  $('leftName').textContent = leftAgent.name;
  $('rightName').textContent = rightAgent.name;
  $('leftRole').textContent = leftAgent.role ? '· ' + leftAgent.role : '';
  $('rightRole').textContent = rightAgent.role ? '· ' + rightAgent.role : '';
  renderPills(t);
}

function renderPills(t) {
  if (realCount === 0) { $('pills').innerHTML = '<span class="apill" style="opacity:.6">エージェント待機中…</span>'; return; }
  const map = { active: 'var(--green)', idle: 'var(--amber)', done: 'var(--muted)' };
  const pill = (a, cls) => {
    const color = map[a.status] || 'var(--muted)';
    return `<span class="apill ${cls}"><span class="ic" style="background:${color}"></span>${esc(a.name)}</span>`;
  };
  $('pills').innerHTML = pill(leftAgent, 'codex') + pill(rightAgent, 'claude');
}

function setStatus(status) {
  const el = $('status');
  const active = (status === 'active' || status === 'forming' || status === 'working');
  el.className = 'status-pill ' + (active ? 'active' : 'disbanded');
  el.querySelector('.lbl').textContent = active ? 'ACTIVE' : (status || '–').toUpperCase();
  $('liveDot').className = 'live-dot' + (active ? ' on' : '');
  $('liveTxt').textContent = active ? 'live — エージェント協調中' : '完了（polling継続）';
}

// Stable dedup key: prefer id, else a compound key (matches server's idless key
// shape). Avoids collapsing every id-less message onto seen.has(undefined). [F2]
function msgKey(m) { return m.id || (m.from + ':' + m.timestamp + ':' + String(m.content || '').slice(0, 50)); }

function appendMessage(m) {
  const key = msgKey(m);
  if (seen.has(key)) return;
  seen.add(key);
  const ts = m.timestamp;
  if (!firstTs) firstTs = ts;
  if (!lastTs || ts > lastTs) lastTs = ts;

  if (m.from === 'ensemble' || m.from === 'system') {
    const f = $('sysFeed');
    const near = isNearBottom(f);
    f.insertAdjacentHTML('beforeend', `<div class="sysmsg">${esc(jpSys(m.content))}<span class="time">${hhmmss(ts)}</span></div>`);
    if (near) f.scrollTop = f.scrollHeight;
    return;
  }
  msgCount++;
  $('count').textContent = msgCount;
  lastAgentLabel = `${m.from} ${hhmmss(ts)}`;
  if (String(m.content || '').includes('COLLAB_DONE')) sawDone = true;
  // Explicit lane match; unknown / 3rd+ agents go to the center lane so they are
  // shown verbatim instead of being misattributed to the right agent. [F3]
  let f;
  if (m.from === leftAgent.name) f = $('leftFeed');
  else if (m.from === rightAgent.name) f = $('rightFeed');
  else f = $('sysFeed');
  const near = isNearBottom(f);
  f.insertAdjacentHTML('beforeend',
    `<div class="msg"><div class="time">${esc(m.from)} · ${hhmmss(ts)}</div><div class="body">${esc(m.content)}</div></div>`);
  if (near) f.scrollTop = f.scrollHeight;
}

function isNearBottom(el) { return el.scrollHeight - el.scrollTop - el.clientHeight < 120; }

const isLive = s => ['active','forming','working'].includes(s);

// Translate ensemble's English system messages into Japanese for the sys lane. [jp-progress]
function jpSys(c) {
  c = String(c || '');
  let m;
  if ((m = c.match(/^(.+?)\s*\(([^)]+)\)\s*has joined\s*#?(.*)$/i)))
    return `${m[1]} が参加（${m[2].replace(/@/, '＠')}）`;
  if ((m = c.match(/^.*?([\w-]+) did not signal ready in time.*$/i)))
    return `⚠ ${m[1]} の準備完了が間に合わず、プロンプトを強制注入（ベストエフォート）`;
  if ((m = c.match(/(\d+)\s*agents? received their task.*collaboration started/i)))
    return `🚀 ${m[1]}体のエージェントがタスクを受領 — 協調開始`;
  if (/has left|has disbanded|disbanded the team|team disbanded/i.test(c)) return '🏁 チーム解散';
  if (/summary (written|ready)|writing summary/i.test(c)) return '📝 サマリ生成中…';
  if (/nudge|stalled|appears idle|no activity/i.test(c)) return `⏰ 停滞検知 — 進行を促しています`;
  if (/collaboration complete|all agents.*done|signaled completion/i.test(c)) return '✅ 全エージェント完了';
  return c; // 未知のシステム文はそのまま
}

let lastAgentLabel = null;
let sawDone = false;

function phaseText(status) {
  if (!isLive(status)) return '✅ 完了 — チームは解散しました';
  if (msgCount === 0) return '🟡 エージェント起動・タスク配布中…';
  if (sawDone) return '🟣 収束中 — サインオフ待ち…';
  return '🟢 協調作業中' + (lastAgentLabel ? `（最新: ${lastAgentLabel}）` : '…');
}

// Reset all per-team state and re-render headers when switching teams, so the
// monitor can follow a freshly-started live run instead of staying pinned. [live-follow]
function switchTeam(t) {
  team = t;
  seen.clear(); lastTs = null; firstTs = null; msgCount = 0;
  lastAgentLabel = null; sawDone = false;
  $('leftFeed').innerHTML = ''; $('rightFeed').innerHTML = ''; $('sysFeed').innerHTML = '';
  $('count').textContent = '0';
  $('elapsed').textContent = '–';
  classifyAgents(t);
  $('task').innerHTML = '<b>タスク:</b> ' + esc(t.description || '(なし)');
  $('teamId').textContent = t.id;
  $('stage').querySelector('.empty')?.remove();
}

// Pick the team to display: a pinned ?team= wins; otherwise auto-follow any live
// team, falling back to the most recent one when nothing is running.
function chooseTeam(teams) {
  const want = qs.get('team');
  if (want) return teams.find(t => t.id === want) || null;
  return teams.find(t => isLive(t.status)) || teams[teams.length - 1] || null;
}

async function tick() {
  try {
    const data = await jget('/api/ensemble/teams');
    const teams = data.teams || [];
    const target = chooseTeam(teams);
    if (!target) { $('liveTxt').textContent = 'チーム待機中…'; return; }

    if (!team || team.id !== target.id) switchTeam(target);
    else { team = target; classifyAgents(target); }   // refresh status/agents in place
    setStatus(team.status);

    const since = lastTs ? ('?since=' + encodeURIComponent(lastTs)) : '';
    const feed = await jget('/api/ensemble/teams/' + team.id + '/feed' + since);
    (feed.messages || []).forEach(appendMessage);

    $('phaseTxt').textContent = phaseText(team.status);

    if (firstTs) {
      const end = isLive(team.status) ? Date.now() : (lastTs ? new Date(lastTs).getTime() : Date.now());
      $('elapsed').textContent = fmtElapsed(end - new Date(firstTs).getTime());
    }
  } catch (e) {
    $('liveTxt').textContent = 'サーバー未応答（再試行中）…';
  }
}

$('sysToggle').onclick = () => {
  showSys = !showSys;
  $('stage').classList.toggle('hide-sys', !showSys);
  $('sysToggle').classList.toggle('off', !showSys);
};

$('stage').insertAdjacentHTML('afterbegin',
  '<div class="empty" style="grid-column:1/-1"><div class="spin">◈</div><div>チームを探しています…</div></div>');

tick();
setInterval(tick, 3000);
</script>
</body>
</html>
